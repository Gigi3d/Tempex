# fly deploy --config deploy/fly/web.fly.toml   (run from the repo root)
app = "tempex-web"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile.web"
  [build.args]
    # Passkeys are bound to this domain: pick the final one before anyone signs up.
    NEXT_PUBLIC_SITE_URL = "https://tempex-web.fly.dev"

[env]
  NEXT_PUBLIC_SITE_URL = "https://tempex-web.fly.dev"
  # Server-side calls stay on Fly's private network.
  TEMPEX_BEACON_URL = "http://tempex-beacon.internal:8787"
  TEMPEX_COURT_URL = "http://tempex-court.internal:8788"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
